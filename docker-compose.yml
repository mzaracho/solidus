version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: <POSTGRES_PASSWORD>
      POSTGRES_DB: solidus_db
    ports:
      - '5433:5432'
    volumes:
      - solidus_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      DATABASE_URL: postgresql://myuser:<POSTGRES_PASSWORD>@db:5432/solidus_db?schema=public
      PORT: 8080
      CORS_ORIGIN: '["http://localhost:3000", "http://localhost:3001", "http://192.168.68.123:3001"]'
      APP_NAME: "Solidus API"
      NODE_ENV: "production"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://192.168.68.123:8080/api
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      INTERNAL_API_URL: http://backend:8080/api
    depends_on:
      - backend

volumes:
  solidus_postgres_data:
