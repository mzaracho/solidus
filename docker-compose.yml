services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Definir POSTGRES_USER en .env (ver .env.example)}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env (ver .env.example)}"
      POSTGRES_DB: "${POSTGRES_DB:?Definir POSTGRES_DB en .env (ver .env.example)}"
    ports:
      # Postgres solo en loopback, siempre (no depende de BIND_ADDRESS).
      - '127.0.0.1:5433:5432'
    volumes:
      - solidus_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:8080:8080'
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Definir POSTGRES_USER en .env}:${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:?Definir POSTGRES_DB en .env}?schema=public"
      JWT_SECRET: "${JWT_SECRET:?Definir JWT_SECRET en .env (ver .env.example)}"
      PORT: 8080
      APP_NAME: "Solidus API"
      NODE_ENV: "production"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}"
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:3001:3000'
    environment:
      INTERNAL_API_URL: http://backend:8080/api
    depends_on:
      - backend

volumes:
  solidus_postgres_data:
