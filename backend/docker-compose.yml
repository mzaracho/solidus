version: '3.8'
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Definir POSTGRES_USER en backend/.env (ver backend/.env.example)}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en backend/.env (ver backend/.env.example)}"
      POSTGRES_DB: "${POSTGRES_DB:?Definir POSTGRES_DB en backend/.env (ver backend/.env.example)}"
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
